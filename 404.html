<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahifa topilmadi — Risola Nashr</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/rn-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@500;600&display=swap">
<style>
:root{--ink:#14201b;--ink-soft:#4a5852;--cream:#f7f3ea;--brand:#1f5d47;--brand-d:#17462f;--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.6}
a{text-decoration:none}
.box{max-width:520px;text-align:center}
img.logo{height:96px;width:auto;margin:0 auto 26px;display:block}
.code{font-family:'Playfair Display',Georgia,serif;font-size:76px;font-weight:600;color:var(--brand);line-height:1}
h1{font-family:'Playfair Display',Georgia,serif;font-size:27px;font-weight:600;margin-top:12px}
p{margin-top:12px;color:var(--ink-soft);font-size:15px}
.acts{margin-top:28px;display:flex;flex-direction:column;gap:11px}
@media(min-width:480px){.acts{flex-direction:row;justify-content:center}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;
  border-radius:999px;font-size:15px;font-weight:700;transition:.2s}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{background:var(--brand-d);transform:translateY(-2px)}
.btn-g{border:1px solid rgba(20,32,27,.16);color:var(--ink)}
.btn-g:hover{border-color:rgba(20,32,27,.36);background:#fff}
.cts{margin-top:30px;display:flex;gap:9px;justify-content:center}
.cts a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;
  border:1px solid rgba(20,32,27,.12);color:var(--ink);transition:.2s}
.cts a:hover{background:var(--brand);border-color:var(--brand);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="/rn-logo.png" alt="Risola Nashr" width="223" height="220">
  <div class="code">404</div>
  <h1>Bunday sahifa topilmadi</h1>
  <p>Havola eskirgan yoki noto'g'ri yozilgan bo'lishi mumkin. Kitoblar katalogi bosh sahifada turibdi.</p>
  <div class="acts">
    <a class="btn btn-p" href="/">Bosh sahifaga qaytish
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="btn btn-g" href="/#kitoblar">Kitoblar katalogi</a>
  </div>
  <div class="cts">
    <a href="tel:+998770799900" aria-label="Telefon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h3l1.6 4-2 1.4a12 12 0 0 0 5.5 5.5l1.4-2 4 1.6v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 3 5.7 2 2 0 0 1 5 3.5z"/></svg></a>
    <a href="https://t.me/risolanashr" target="_blank" rel="noopener" aria-label="Telegram kanal">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 4.2 3.3 11.3c-1.1.4-1.1 1.9 0 2.3l4.5 1.4 1.7 5.3c.3.9 1.4 1.1 2 .4l2.5-2.5 4.5 3.3c.8.6 1.9.2 2.1-.8l3-14.2c.2-1-.8-1.8-1.7-1.4zM9.2 14.3l8.6-5.3-6.9 6.3-.3 3.4z"/></svg></a>
    <a href="https://www.instagram.com/risolanashr" target="_blank" rel="noopener" aria-label="Instagram">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.4" cy="6.6" r="1.15" fill="currentColor" stroke="none"/></svg></a>
  </div>
</main>
</body>
</html>
